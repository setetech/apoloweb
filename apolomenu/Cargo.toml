[package]
name = "apolomenu"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Menu do Apolo em Rust: login no Oracle (thin, sem client) e chamada das rotinas liberadas ao usuario, com a tela em WebView"
publish = false

[dependencies]
# Oracle via protocolo TNS em Rust puro: dispensa Oracle Client / Instant Client / OCI
oracle-rs = "0.1.7"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
# Janela + WebView (WebView2 no Windows, WebKitGTK no Linux)
tao = "0.37"
wry = "0.57"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# case-insensitive: o ApoloWeb grava [Oracle] e le [oracle] no mesmo arquivo
rust-ini = { version = "0.21", features = ["case-insensitive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
